<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Virtual PBF Workbench banner</title>
  <desc id="desc">A professional banner for an empirical support-aware virtual PBF voxel probability workbench.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.52" stop-color="#172033"/>
      <stop offset="1" stop-color="#263446"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="markBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="markOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.35" stop-color="#22c55e"/>
      <stop offset="0.68" stop-color="#facc15"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#94a3b8" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <style>
      .title { font-family: Segoe UI, Inter, Arial, sans-serif; font-size: 54px; font-weight: 750; fill: #f8fafc; letter-spacing: 0; }
      .subtitle { font-family: Segoe UI, Inter, Arial, sans-serif; font-size: 22px; font-weight: 500; fill: #cbd5e1; letter-spacing: 0; }
      .label { font-family: Segoe UI, Inter, Arial, sans-serif; font-size: 17px; font-weight: 650; fill: #e2e8f0; letter-spacing: 0; }
      .small { font-family: Segoe UI, Inter, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #94a3b8; letter-spacing: 0; }
      .math { font-family: Consolas, Menlo, monospace; font-size: 18px; font-weight: 600; fill: #bae6fd; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>

  <path d="M0 286C133 243 229 306 358 260C508 206 564 102 740 125C897 145 1015 236 1280 153V360H0Z" fill="#0ea5e9" opacity="0.1"/>
  <path d="M0 318C138 291 237 334 388 299C528 267 625 188 788 205C951 221 1075 286 1280 235V360H0Z" fill="#f97316" opacity="0.1"/>

  <g transform="translate(72 52)" filter="url(#shadow)">
    <rect x="0" y="0" width="248" height="248" rx="26" fill="url(#panel)" stroke="#475569" stroke-opacity="0.75"/>
    <path d="M54 193V76L124 42L194 76V193L124 228Z" fill="#0b1220" stroke="#7dd3fc" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M54 76L124 111L194 76" fill="none" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="3"/>
    <path d="M124 111V228" fill="none" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="3"/>
    <g opacity="0.96">
      <rect x="75" y="149" width="20" height="45" rx="3" fill="url(#markOrange)"/>
      <rect x="101" y="126" width="20" height="68" rx="3" fill="url(#markOrange)"/>
      <rect x="127" y="105" width="20" height="89" rx="3" fill="url(#markOrange)"/>
      <rect x="153" y="134" width="20" height="60" rx="3" fill="url(#markOrange)"/>
    </g>
    <path d="M73 127C93 89 117 71 154 77C181 81 195 98 203 124C174 116 151 119 130 138C111 154 92 158 73 127Z" fill="url(#markBlue)" opacity="0.92"/>
    <path d="M77 127C99 137 112 136 130 121C151 103 174 101 199 112" fill="none" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <circle cx="74" cy="78" r="7" fill="#f8fafc"/>
    <circle cx="124" cy="111" r="7" fill="#f8fafc"/>
    <circle cx="194" cy="78" r="7" fill="#f8fafc"/>
  </g>

  <g transform="translate(366 82)">
    <text class="title" x="0" y="0" dominant-baseline="hanging">Virtual PBF Workbench</text>
    <text class="subtitle" x="2" y="76" dominant-baseline="hanging">Empirical, support-aware virtual powder bed fusion simulation</text>

    <g transform="translate(2 130)">
      <rect x="0" y="0" width="184" height="42" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.55"/>
      <text class="label" x="18" y="22" dominant-baseline="middle">Voxel lattice</text>

      <rect x="202" y="0" width="214" height="42" rx="8" fill="#0f172a" stroke="#22c55e" stroke-opacity="0.55"/>
      <text class="label" x="220" y="22" dominant-baseline="middle">Layer-wise Markov field</text>

      <rect x="434" y="0" width="194" height="42" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.65"/>
      <text class="label" x="452" y="22" dominant-baseline="middle">ROI calibration</text>

      <rect x="646" y="0" width="188" height="42" rx="8" fill="#0f172a" stroke="#e879f9" stroke-opacity="0.55"/>
      <text class="label" x="664" y="22" dominant-baseline="middle">Machine maps</text>
    </g>

    <text class="math" x="2" y="216">P(layer z) = f(neighbors, lower layer, IDP, bias) -> stochastic binary geometry</text>
    <text class="small" x="2" y="248">Not FEM, thermal, melt-pool, fluid-flow, or residual-stress analysis.</text>
  </g>

  <g transform="translate(1014 72)">
    <rect x="0" y="0" width="190" height="216" rx="18" fill="#0b1220" stroke="#475569"/>
    <text class="small" x="24" y="34">Deviation scale</text>
    <rect x="24" y="56" width="142" height="20" rx="10" fill="url(#heat)"/>
    <text class="small" x="24" y="100">-1 mm</text>
    <text class="small" x="116" y="100">+1 mm</text>
    <g transform="translate(34 128)" opacity="0.9">
      <rect x="0" y="32" width="16" height="34" fill="#38bdf8"/>
      <rect x="24" y="18" width="16" height="48" fill="#22c55e"/>
      <rect x="48" y="6" width="16" height="60" fill="#facc15"/>
      <rect x="72" y="26" width="16" height="40" fill="#f97316"/>
      <rect x="96" y="0" width="16" height="66" fill="#ef4444"/>
    </g>
    <text class="small" x="24" y="190">Probability volume</text>
  </g>
</svg>
